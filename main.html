<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quest Mods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#050505;
    --bg-1:#0c0808;
    --panel:#0d0a0a;
    --panel-border:rgba(255,255,255,0.07);
    --red:#e0212b;
    --red-2:#ff4b4b;
    --text:#f3f0f0;
    --text-dim:#8a8080;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background:var(--bg-0);
    color:var(--text);
    font-family:'Inter', sans-serif;
    overflow:hidden;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }

  /* ---------- background ---------- */
  .bg{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(circle at 50% 50%, var(--bg-1) 0%, var(--bg-0) 70%);
  }

  .grid{
    position:fixed;
    inset:0;
    z-index:1;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, black 0%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, black 0%, transparent 75%);
    animation: gridDrift 40s linear infinite;
  }

  @keyframes gridDrift{
    0%{ background-position: 0 0; }
    100%{ background-position: 44px 88px; }
  }

  .orb{
    position:fixed;
    z-index:1;
    border-radius:50%;
    filter:blur(90px);
    opacity:0.45;
    will-change:transform;
  }
  .orb-a{
    width:46vw; height:46vw;
    background:var(--red);
    top:-14%; left:-12%;
    opacity:0.28;
    animation:float-a 22s ease-in-out infinite;
  }
  .orb-b{
    width:38vw; height:38vw;
    background:var(--red-2);
    bottom:-18%; right:-10%;
    opacity:0.22;
    animation:float-b 26s ease-in-out infinite;
  }
  .orb-c{
    width:26vw; height:26vw;
    background:#7a0000;
    top:30%; right:18%;
    opacity:0.2;
    animation:float-c 30s ease-in-out infinite;
  }

  @keyframes float-a{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(6vw,8vh) scale(1.12); }
  }
  @keyframes float-b{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-7vw,-6vh) scale(1.08); }
  }
  @keyframes float-c{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-4vw,5vh) scale(0.9); }
  }

  .particles{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
  }
  .particle{
    position:absolute;
    width:3px; height:3px;
    border-radius:50%;
    background:var(--text);
    opacity:0;
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0); opacity:0; }
    10%{ opacity:0.5; }
    90%{ opacity:0.35; }
    100%{ transform:translateY(-100vh); opacity:0; }
  }

  /* ---------- panel ---------- */
  .stage{
    position:relative;
    z-index:3;
    height:100dvh;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .panel{
    position:relative;
    width:min(480px, 100%);
    padding:56px 44px 48px;
    border-radius:24px;
    background:linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
    border:1px solid var(--panel-border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    text-align:center;
    opacity:0;
    transform:translateY(28px) scale(0.97);
    animation:panelIn 0.9s cubic-bezier(.16,1,.3,1) 0.15s forwards;
    box-shadow:
      0 30px 80px -20px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.06);
  }

  .panel::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:24px;
    padding:1px;
    background:linear-gradient(135deg, rgba(224,33,43,0.55), transparent 40%, transparent 60%, rgba(255,75,75,0.35));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events:none;
    opacity:0.8;
  }

  @keyframes panelIn{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .title{
    font-family:'Sora', sans-serif;
    font-weight:800;
    font-size:clamp(38px, 7vw, 54px);
    letter-spacing:-0.02em;
    background:linear-gradient(135deg, #ffffff 15%, #ff8a8a 55%, var(--red) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:0;
    animation:fadeUp 0.7s ease 0.55s forwards;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .btn-wrap{
    margin-top:34px;
    opacity:0;
    animation:fadeUp 0.7s ease 0.75s forwards;
  }

  .btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:17px 40px;
    font-family:'Sora', sans-serif;
    font-weight:600;
    font-size:15.5px;
    letter-spacing:0.01em;
    color:#0a0505;
    background:linear-gradient(135deg, var(--red-2), var(--red));
    background-size:200% 200%;
    border:none;
    border-radius:14px;
    cursor:pointer;
    text-decoration:none;
    overflow:hidden;
    isolation:isolate;
    transition:transform 0.35s cubic-bezier(.16,1,.3,1), box-shadow 0.35s ease;
    box-shadow:0 0 0 0 rgba(139,107,255,0.0);
    animation:gradientShift 6s ease infinite, pulseGlow 2.8s ease-in-out infinite;
  }

  @keyframes gradientShift{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }

  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 0 18px 0 rgba(224,33,43,0.4), 0 0 0 0 rgba(255,75,75,0.0); }
    50%{ box-shadow:0 0 36px 6px rgba(224,33,43,0.55), 0 0 22px 2px rgba(255,75,75,0.3); }
  }

  .btn:hover{
    transform:translateY(-3px) scale(1.035);
  }
  .btn:active{
    transform:translateY(-1px) scale(0.98);
  }

  .btn::after{
    content:"";
    position:absolute;
    top:0; left:-60%;
    width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);
    transform:skewX(-20deg);
    animation:shine 3.2s ease-in-out infinite;
  }

  @keyframes shine{
    0%{ left:-60%; }
    45%{ left:120%; }
    100%{ left:120%; }
  }

  .btn svg{
    width:16px; height:16px;
    transition:transform 0.35s cubic-bezier(.16,1,.3,1);
  }
  .btn:hover svg{
    transform:translateX(4px);
  }

  :focus-visible{
    outline:2px solid var(--red-2);
    outline-offset:3px;
  }

</style>
</head>
<body>

  <div class="bg"></div>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
  <div class="grid"></div>
  <div class="particles" id="particles"></div>

  <div class="stage">
    <div class="panel">
      <h1 class="title">Quest&nbsp;Mods</h1>

      <div class="btn-wrap">
        <a class="btn" href="https://bstlar.com/zz/Moonlit" id="questBtn">
          Quest Mods
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
      </div>
    </div>
  </div>

<script>
  // ambient rising particles
  const field = document.getElementById('particles');
  const COUNT = 26;
  for (let i = 0; i < COUNT; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const left = Math.random() * 100;
    const delay = Math.random() * 14;
    const duration = 10 + Math.random() * 10;
    const size = 1.5 + Math.random() * 2.5;
    p.style.left = left + 'vw';
    p.style.bottom = '-10px';
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.animationDelay = delay + 's';
    p.style.animationDuration = duration + 's';
    field.appendChild(p);
  }
</script>

</body>
</html>
